<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>音频管理系统</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        .hidden { display: none; }
        .login-box { border: 1px solid #ccc; padding: 30px; max-width: 300px; margin: 100px auto; border-radius: 8px; text-align: center; }
        .upload-section { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        button { cursor: pointer; padding: 5px 10px; margin-right: 5px; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        .btn-delete { background-color: #ff4d4d; color: white; border: none; }
        .btn-play { background-color: #4CAF50; color: white; border: none; }
        audio { height: 30px; vertical-align: middle; }
        input { margin-bottom: 10px; padding: 5px; width: 90%; }
        .pagination { margin-top: 20px; text-align: center; }
        .pagination button { margin: 0 5px; }
        .page-info { margin: 0 15px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 登录模块 -->
    <div id="loginSection" class="login-box">
        <h2>系统登录</h2>
        <input type="text" id="username" placeholder="用户名 (admin)">
        <input type="password" id="password" placeholder="密码 (123456)">
        <button onclick="handleLogin()">登录</button>
        <p id="loginMsg" style="color: red;"></p>
    </div>

    <!-- 主功能模块 (登录后显示) -->
    <div id="mainSection" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>音频管理系统</h1>
            <button onclick="logout()" style="background-color: #666; color: white;">退出登录</button>
        </div>

        <!-- 上传模块 -->
        <div class="upload-section">
            <h3>上传音频</h3>
            <input type="file" id="fileInput" accept=".mp3,.wav">
            <button onclick="uploadFile()">上传</button>
            <p id="uploadStatus"></p>
        </div>

        <!-- 列表模块 -->
        <h3>音频列表</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>文件名</th>
                    <th>上传时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="audioList">
                <!-- 数据将通过 JS 插入 -->
            </tbody>
        </table>
        
        <!-- 分页控件 -->
        <div class="pagination">
            <button onclick="changePage(currentPage - 1)" id="prevBtn">上一页</button>
            <span id="pageInfo" class="page-info">第 1 / 1 页</span>
            <button onclick="changePage(currentPage + 1)" id="nextBtn">下一页</button>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentUserToken = localStorage.getItem('token');
        let currentRole = localStorage.getItem('roleLevel');
        
        // 分页相关变量
        let currentPage = 1;
        let pageSize = 10;
        let totalPages = 1;

        // 页面加载时检查登录状态
        window.onload = function() {
            if (currentUserToken) {
                showMainSection();
                loadList();
            }
        };

        async function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                document.getElementById('loginMsg').innerText = '请输入用户名和密码';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                
                if (data.code === 200) {
                    currentUserToken = data.token;
                    currentRole = data.roleLevel;
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('roleLevel', data.roleLevel);
                    showMainSection();
                    loadList();
                } else {
                    document.getElementById('loginMsg').innerText = data.msg || '登录失败';
                }
            } catch (error) {
                document.getElementById('loginMsg').innerText = '网络错误，请检查服务器是否启动';
            }
        }

        function showMainSection() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('roleLevel');
            location.reload();
        }

        // 获取通用的请求头
        function getHeaders() {
            return {
                'Authorization': 'Bearer ' + currentUserToken
            };
        }

        async function loadList() {
            try {
                const response = await fetch(`${API_BASE}/audio/list?page=${currentPage}&size=${pageSize}`, {
                    headers: getHeaders()
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        alert('登录已过期，请重新登录');
                        logout();
                        return;
                    }
                    throw new Error('HTTP error! status: ' + response.status);
                }
                
                const data = await response.json();
                const list = document.getElementById('audioList');
                list.innerHTML = '';

                // 更新分页信息
                totalPages = data.pages || 1;
                updatePaginationUI();

                if (data.records && data.records.length > 0) {
                    data.records.forEach(item => {
                        const row = document.createElement('tr');
                        const date = new Date(item.createTime).toLocaleString();
                        
                        // 权限控制：只有 roleLevel 为 0 的管理员才显示删除按钮
                        let deleteBtn = '';
                        if (currentRole == 0) {
                            deleteBtn = `<button class="btn-delete" onclick="deleteAudio(${item.id})">删除</button>`;
                        }

                        row.innerHTML = `
                            <td>${item.id}</td>
                            <td>${item.fileName}</td>
                            <td>${date}</td>
                            <td>
                                <audio controls src="${API_BASE}/audio/stream/${item.id}"></audio>
                                ${deleteBtn}
                            </td>
                        `;
                        list.appendChild(row);
                    });
                } else {
                    list.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px;">暂无音频数据</td></tr>';
                }
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('audioList').innerHTML = '<tr><td colspan="4" style="text-align: center; color: red; padding: 20px;">加载失败，请刷新重试</td></tr>';
            }
        }

        // 更新分页UI
        function updatePaginationUI() {
            document.getElementById('pageInfo').innerText = `第 ${currentPage} / ${totalPages} 页`;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        // 切换页码
        async function changePage(page) {
            if (page < 1 || page > totalPages) {
                return;
            }
            currentPage = page;
            await loadList();
            // 滚动到列表顶部
            document.querySelector('h3').scrollIntoView({ behavior: 'smooth' });
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('请选择文件');
                return;
            }

            // 验证文件类型
            const fileName = file.name.toLowerCase();
            if (!fileName.endsWith('.mp3') && !fileName.endsWith('.wav')) {
                alert('仅支持 mp3 或 wav 格式的文件');
                return;
            }

            // 验证文件大小（10MB）
            if (file.size > 10 * 1024 * 1024) {
                alert('文件大小不能超过 10MB');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            document.getElementById('uploadStatus').innerText = '上传中...';

            try {
                const response = await fetch(`${API_BASE}/audio/upload`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: formData
                });
                
                const result = await response.text();
                
                if (response.ok) {
                    document.getElementById('uploadStatus').innerText = '✅ ' + result;
                    document.getElementById('uploadStatus').style.color = 'green';
                    fileInput.value = '';
                    // 上传成功后回到第一页并刷新列表
                    currentPage = 1;
                    await loadList();
                } else {
                    document.getElementById('uploadStatus').innerText = '❌ 上传失败: ' + result;
                    document.getElementById('uploadStatus').style.color = 'red';
                }
            } catch (error) {
                document.getElementById('uploadStatus').innerText = '❌ 上传出错: ' + error.message;
                document.getElementById('uploadStatus').style.color = 'red';
            }
        }

        async function deleteAudio(id) {
            if (!confirm('确定要删除该音频吗？此操作不可恢复！')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/audio/${id}`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });
                
                if (response.ok) {
                    // 如果当前页只有一条数据且不是第一页，则回到上一页
                    const currentListLength = document.getElementById('audioList').rows.length;
                    if (currentListLength === 1 && currentPage > 1) {
                        currentPage--;
                    }
                    await loadList();
                } else {
                    const errorMsg = await response.text();
                    alert('删除失败: ' + errorMsg);
                }
            } catch (error) {
                alert('网络错误: ' + error.message);
            }
        }
    </script>
</body>
</html>
